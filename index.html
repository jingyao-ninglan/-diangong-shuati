   s="<b>解题：</b>爆炸危险区域中，0区指爆炸性气体混合物连续出现或长期出现的场所；1区是在正常运行时可能出现，2区则通常是异常情况下短时间出现。因此题干对应0区的定义。";
 }else if(/UPS/.test(stem)&&/后备式/.test(stem)){
   s="<b>解题：</b>后备式UPS平时由市电供电，市电异常时才切换到逆变器和蓄电池，因此结构相对简单、价格较低，但存在切换时间。";
 }else if(/在线式UPS/.test(stem)&&/效率/.test(stem)){
   s="<b>解题：</b>在线式UPS通常由整流器—逆变器持续供电，负载始终经过功率变换环节，因此相较于直接旁路供电结构，正常市电状态下的能量转换损耗更明显。";
 }else if(/负反馈/.test(stem)&&/稳态误差/.test(stem)){
   s="<b>解题：</b>比例调节只能降低稳态误差，不能在一般情况下把阶跃输入的稳态误差消除；加入积分环节后，积分会持续累积误差信号，能够消除静差，因此应选择PI类调节器。";
 }else if(/转速负反馈/.test(stem)&&/电枢回路电阻压降/.test(stem)){
   s="<b>解题：</b>直流电动机负载增加时，电枢电流增大，电枢回路电阻压降随之增大，使转速下降。转速负反馈检测转速下降并提高整流输出电压，从而补偿电枢回路电阻压降造成的转速下降。";
 }else if(/安全|触电|验电|接地|停电|漏电/.test(stem)){
   s="<b>解题：</b>这类安全题首先判断是否符合“先停电、再验电、必要时接地并采取隔离和警示措施”的基本原则。凡是把带电检修、未验电、取消防护或将无电导线裸露作为正常做法的选项，都与安全操作要求不符。";
 }else if(/电动机|异步电动机|接触器|热继电器/.test(stem)){
   s="<b>解题：</b>本题围绕电动机控制与保护。判断选项时要分别看启动、运行、停车以及过载、短路等保护功能，不能把接触器、热继电器和断路器的作用混为一谈。正确答案对应题干所描述的具体功能。";
 }else if(/判断|\( \)|（ ）/.test(stem)||z.type==="judge"){
   s="<b>判断方法：</b>先把题干还原成一个明确的技术命题，再检查其中的“必须、全部、只需、一定、不得”等限定词。若其中任一关键条件与电工技术原理或安全要求冲突，则整句话不能成立。";
 }else{
   s="<b>解题：</b>题干要求判断的是“"+esc2(stem)+"”。正确答案为“"+esc2(ans)+"”。判断时应先锁定题干的核心对象和限定条件，再用对应的电工原理、设备功能或安全规范逐项核对，而不是只凭关键词猜答案。";
 }
 if(z.options&&z.options.length){
   s+="<br><br><b>为什么选它：</b>正确选项 "+esc2(ans)+" 与题干中的核心条件相符。";
   var wrong=(z.options||[]).filter(function(o){return a.indexOf(o.key)<0;});
   if(wrong.length){
     s+="<br><b>其他选项：</b>";
     wrong.forEach(function(o){s+="<br>• "+esc2(o.key)+"："+esc2(o.text)+" —— 与题干要求或上述技术原理不符。";});
   }
 }
 return s;
}
window.showCurrentExplanation=function(){var item=pool[order[idx]];if(item&&item.q){showExplanation(item.q);var p=document.getElementById("xpanel");if(p)p.scrollIntoView({behavior:"smooth",block:"start");}}};function showExplanation(z){
 var card=document.querySelector("#app .card");if(!card)return;
 var p=document.getElementById("xpanel");
 if(!p){p=document.createElement("div");p.id="xpanel";p.className="explain";card.appendChild(p)}
 var h="<h3>📖 详细解析</h3><p><b>正确答案：</b>"+esc2(z.answer.join("、"))+"</p><p>"+explainText(z)+"</p>";
 if(z.options&&z.options.length){
   h+="<div style=\"margin-top:10px\"><b>逐项判断：</b></div>";
   z.options.forEach(function(o){var yes=z.answer.indexOf(o.key)>=0;h+="<p class=\""+(yes?"right":"wrong")+"\"><b>"+o.key+"：</b>"+esc2(o.text)+(yes?"　✅ 正确":"　❌ 错误")+"</p>"});
 }else h+="<p><b>判断结论：</b>"+(z.answer[0]==="√"?"题干表述正确。":"题干表述错误。")+"</p>";
 p.innerHTML=h;
}
