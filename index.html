   s="<b>考点：三相对称Y接负载计算。</b><br>每相阻抗Z=√(6²+8²)=10Ω；Y接时U相=380/√3≈219.4V，且I线=I相，所以I≈219.4/10≈21.94A。";
 }else if(has(/三相电源线电压为380V/)&&has(/10Ω/)){
   s="<b>考点：三相对称电阻负载。</b><br>先看图确认星形还是三角形，再确定仪表测的是线电压、相电压、线电流还是相电流。三角形连接时U相=U线，I线=√3I相；星形连接时U相=U线/√3，I线=I相。";
 }else if(has(/步进电机/)&&has(/控制脉冲/)){
   s="<b>考点：步进电机控制链。</b><br>典型链路为“脉冲发生器→脉冲分配器→功率驱动→步进电机”。脉冲频率主要决定转速，脉冲数量主要决定累计角位移，分配器负责按相序分配驱动信号。";
 }else if(has(/三相对称电路/)&&has(/星形/)){
   s="<b>考点：三相对称星形负载。</b><br>线电压与相电压关系为U线=√3U相；对称星形负载中线电流等于相电流，三相电流大小相等、相位彼此相差120°。";
 }else if(has(/过零触发/)){
   s="<b>考点：过零触发控制。</b><br>过零触发不是通过每个半周改变触发角来斩波，而是在电压过零附近接通/关断，并通过一个设定周期内导通周波数的比例调节平均功率，因此输出波形的每个导通周波较完整。";
 }else if(has(/相控整流/)&&has(/换相/)){
   s="<b>考点：换相。</b><br>相控整流中，电流从一组晶闸管转移到另一组晶闸管的过程叫换相；“整流”是交流变直流的变换过程，两者不是同义词。";
 }else if(has(/运算放大器|集成运放/)&&has(/虚短|虚断/)){
   s="<b>考点：理想运放近似条件。</b><br>在线性负反馈工作区，可近似认为两输入端电压相等（虚短），输入端电流近似为零（虚断）。进入饱和等非线性区域后不能机械使用这两个条件。";
 }else if(has(/编码器/)&&has(/二进制代码/)){
   s="<b>考点：编码器与译码器。</b><br>编码器把输入信息转换成二进制代码；译码器则把代码还原成对应输出，方向相反。题目若描述“把具有特定意义的信息变成二进制代码”，对应编码器。";
 }else if(has(/8051|80C51/)&&has(/ALE/)){
   s="<b>考点：8051 ALE引脚。</b><br>ALE是地址锁存允许信号，在扩展外部存储器时用于锁存低8位地址，因此不能把ALE理解为串行通信或普通数据输出端。";
 }else if(has(/片内.*存储|31脚/)&&has(/低电平/)){
   s="<b>考点：8051 EA引脚。</b><br>EA/VPP用于选择程序存储器来源。使用片内程序存储器时EA应为高电平，因此“访问片内存储器必须接低电平”的说法错误。";
 }else if(has(/消防水泵/)&&has(/全压启动/)){
   s="<b>考点：消防水泵启动方式。</b><br>消防水泵控制并非只有星—三角或自耦降压等方式，在满足设备和供电条件时也存在直接全压启动方案，因此“没有全压启动电路”的绝对表述不成立。";
 }else if(has(/高频计数器|高速计数器/)&&has(/扫描周期/)){
   s="<b>考点：高速计数器与扫描周期。</b><br>高速计数器用于处理普通扫描难以及时捕获的高速脉冲；经典S7-200手册明确说明高速计数器的计数可独立于CPU扫描，因此不能简单把它当作普通计数器。";
 }else if(has(/T1中断入口地址|001BH/)){
   s="<b>考点：8051中断向量。</b><br>经典8051的定时器/计数器1中断向量地址为001BH，因此题干给出001BH时该说法正确。";
 }else if(has(/单片机/)&&has(/方式2/)&&has(/最大计数值/)){
   s="<b>考点：8051定时/计数器方式2。</b><br>方式2是8位自动重装方式，计数寄存器为8位，因此最大计数范围对应256个状态，而不是16位方式的65536个状态。";
 }else if(has(/HEX/)&&has(/Keil C51|烧录/)){
   s="<b>考点：单片机程序文件。</b><br>Keil C51编译、链接后通常生成HEX文件，烧录器将该文件中的机器码写入单片机程序存储器。TXT、DOCX不是烧录程序文件。";
 }else if(has(/超声波流量计/)&&has(/速度差法/)){
   s="<b>考点：超声波流量测量。</b><br>时差式超声波流量计利用顺、逆流传播时间不同来计算流速，因此题目出现“速度差法”时应优先对应这一测量原理。";
 }else if(has(/变压器容量/)&&has(/130%|1.3/)){
   s="<b>考点：变频器供电容量选型。</b><br>这类题按题库给出的经验选型系数计算，若题目明确给出约1.3倍的经验要求，应将变频器容量乘以1.3，再与其他设备容量及裕量一起核对。";
 }else if(has(/热继电器/)&&has(/短路保护/)){
   s="<b>考点：热继电器的保护范围。</b><br>热继电器主要用于电动机过载保护，不负责快速切除短路大电流；短路保护通常由断路器或熔断器完成。";
 }else if(has(/安全|触电|验电|接地|停电|漏电/)){
   s="<b>考点：电气安全。</b><br>判断此类题应先核对停电、验电、防止误送电、隔离、接地和警示等措施，再判断操作是否安全。不要把“未验电”“带电检修”等高风险操作视为正常流程。";
 }else if(z.type==="judge"){
   s="<b>判断方法：</b>先找题干中的技术对象，再检查条件和结论是否符合该对象的定义、工作原理或计算关系；遇到“必须、全部、只能、一定、不得”等绝对化词语要重点核对。";
 }else{
   s="<b>解题思路：</b>先提取题干的对象、已知条件和限定词，再把正确答案与这些条件逐项对应。<br><b>正确答案：</b>"+esc2(ans)+"。当前题目没有足够依据生成专门计算过程，因此不虚构公式或结论。";
 }
 return s+choices();
}
function showExplanation(z){
 var card=document.querySelector("#app .card");if(!card)return;
 var p=document.getElementById("xpanel");
 if(!p){p=document.createElement("div");p.id="xpanel";p.className="explain";card.appendChild(p)}
 var item=pool[order[idx]],fmt=picTextFactory(item);
 var h="<h3>📖 详细解析</h3>";
 h+="<div class='ex-question'><b>题目：</b><div class='ex-stem'>"+fmt(z.stem)+"</div></div>";
 h+="<p><b>正确答案：</b><span class='answer'>"+esc2(z.answer.join("、"))+"</span></p>";
 h+="<div class='ex-main'>"+explainText(z)+"</div>";
 if(z.options&&z.options.length){
   h+="<div style='margin-top:14px'><b>逐项判断：</b></div>";
   z.options.forEach(function(o){
     var yes=z.answer.indexOf(o.key)>=0;
     h+="<div class='ex-opt "+(yes?"ex-right":"ex-wrong")+"'><b>"+o.key+"：</b>"+fmt(o.text)+" <span>"+(yes?"✅ 正确":"❌ 错误")+"</span></div>";
   });
 }else{
   h+="<p><b>判断结论：</b>"+(z.answer[0]==="√"?"题干表述正确。":"题干表述错误。")+"</p>";
 }
 p.innerHTML=h;
}
function addBar(){
 var w=document.querySelector(".wrap");if(!w)return;
 var b=document.getElementById("xbar");
 if(!b){b=document.createElement("div");b.id="xbar";b.style="display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px;position:relative;z-index:10";
 b.innerHTML="<button id=xexp>📖 解析</button><button id=xmock>📝 模拟考试</button><button id=xfav>⭐ 收藏</button><button id=xwrong>📕 错题本</button><button id=xstat>📊 学习统计</button><button id=xdark>🌙 夜间模式</button>";
 w.insertBefore(b,w.querySelector(".mode")||w.firstChild);}
 Array.from(b.children).forEach(function(x){x.style="border:1px solid #cfd7e3;border-radius:10px;padding:8px 10px;background:#fff;color:#25324a;font-weight:700;font-size:14px"});
 document.getElementById("xdark").onclick=function(){window.toggleDark()};document.getElementById("xexp").textContent="📖 解析";document.getElementById("xexp").onclick=function(){var z=current();if(!z){return}showExplanation(z);setTimeout(function(){var q=document.getElementById("xpanel");if(q){q.scrollIntoView({behavior:"smooth",block:"start"});}},50);};
 document.getElementById("xmock").onclick=function(){mode="mock";random=false;document.getElementById("mock").classList.add("on");document.getElementById("normal").classList.remove("on");document.getElementById("random").classList.remove("on");init()};
 document.getElementById("xfav").onclick=function(){var z=current();if(!z)return;var k="第"+setId+"套第"+z.n+"题";if(state.fav[k]){delete state.fav[k];panel("<h3>⭐ 收藏</h3>已取消："+k)}else{state.fav[k]=1;panel("<h3>⭐ 收藏</h3>已收藏："+k)}save()};
 document.getElementById("xwrong").onclick=function(){var a=Object.keys(state.wrong);panel("<h3>📕 错题本</h3>"+(a.length?a.join("、"):"暂无错题"))};
 document.getElementById("xstat").onclick=function(){var a=Object.keys(state.answered).length,r=Object.keys(state.right).length;panel("<h3>📊 学习统计</h3>已答："+a+"题　答对："+r+"题　正确率："+(a?Math.round(r/a*100):0)+"%")};
 document.getElementById("xdark").onclick=function(){state.dark=!state.dark;document.body.classList.toggle("dark",state.dark);document.documentElement.classList.toggle("dark",state.dark);save()};
}
addBar();
try{
 if(state.position){
   if(state.position.setId>=1&&state.position.setId<=10)setId=state.position.setId;
   if(["normal","random","mock"].indexOf(state.position.mode)>=0)mode=state.position.mode;
   random=!!state.position.random;
   buildPool();
   idx=Math.max(0,Math.min(Number(state.position.idx)||0,pool.length-1));
   document.getElementById("normal").classList.toggle("on",mode==="normal");
   document.getElementById("random").classList.toggle("on",mode==="random");
   document.getElementById("mock").classList.toggle("on",mode==="mock");
   if(sel)sel.value=String(setId);
   render();
 }
}catch(e){}
})();
