<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#2563eb'><title>电工高级2024·十套题库</title><style>
:root{--bg:#f3f6fa;--panel:#fff;--text:#172033;--muted:#667085;--line:#d8dee8;--blue:#2563eb;--blue2:#eaf1ff;--green:#16a34a;--greenbg:#ecfdf3;--red:#dc2626;--redbg:#fef2f2;--yellow:#ca8a04;--yellowbg:#fffbeb;--gray:#eef2f7;--shadow:0 4px 18px #00000010}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body.dark{--bg:#0b1020;--panel:#111827;--text:#f3f4f6;--muted:#9ca3af;--line:#374151;--blue:#3b82f6;--blue2:#172554;--gray:#1f2937;--shadow:0 4px 18px #0008}
button,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}
.appbar{position:sticky;top:0;z-index:50;background:var(--panel);border-bottom:1px solid var(--line)}.header{max-width:860px;margin:auto;padding:11px 14px;display:flex;gap:10px;align-items:center}.title{font-size:18px;font-weight:900;flex:1}.set-select{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:8px 10px}
.wrap{max-width:860px;margin:0 auto;padding:14px 14px 90px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar button{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);padding:9px 11px;font-weight:750}.toolbar button.active{border-color:var(--blue);background:var(--blue2);color:var(--blue)}
.card{background:var(--panel);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:14px;margin-bottom:9px}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:var(--blue2);color:var(--blue);font-size:12px;font-weight:800}.progress{height:7px;background:var(--gray);border-radius:99px;overflow:hidden;margin:8px 0 18px}.progress i{display:block;height:100%;background:var(--blue)}.source{font-size:13px;color:var(--muted);margin-bottom:10px}.question{font-size:19px;line-height:1.72;font-weight:700;margin-bottom:16px;white-space:pre-wrap}
.option{display:block;width:100%;text-align:left;background:var(--panel);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;margin:10px 0;line-height:1.55;transition:.12s}.option:hover{border-color:#7da2ff}.option.selected{background:var(--blue2);border-color:var(--blue)}.option.correct{background:var(--greenbg);border-color:var(--green);color:#166534}.option.wrong{background:var(--redbg);border-color:var(--red);color:#991b1b}.dark .option.correct{background:#052e1b;color:#dcfce7}.dark .option.wrong{background:#3b1111;color:#fee2e2}.dark .option.selected{background:#172554;color:#dbeafe}.key{font-weight:900;margin-right:7px}
.result{margin-top:14px;padding:12px;border-radius:12px;line-height:1.6;font-weight:700;background:var(--gray)}.result.good{background:var(--greenbg);color:#166534}.result.bad{background:var(--redbg);color:#991b1b}.result.skip{background:var(--yellowbg);color:#92400e}.dark .result.good{background:#052e1b;color:#bbf7d0}.dark .result.bad{background:#3b1111;color:#fecaca}.dark .result.skip{background:#422006;color:#fde68a}
.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px}.btn{border:0;border-radius:12px;padding:12px 8px;background:var(--blue);color:#fff;font-weight:850;min-height:52px}.btn.secondary{background:var(--gray);color:var(--text)}
.explain{margin-top:14px;padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--panel);line-height:1.75}.explain h3{margin:0 0 9px}.ex-question,.ex-opt{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0}.ex-right{background:var(--greenbg)}.ex-wrong{background:var(--redbg)}.dark .ex-right{background:#052e1b}.dark .ex-wrong{background:#3b1111}
.qpic{text-align:center;margin:9px 0;overflow:hidden}.qpic img{display:block;max-width:100%;height:auto;max-height:430px;object-fit:contain;margin:8px auto;border-radius:8px}.qdiagram{text-align:center;margin:10px 0}.formula{display:inline-block;padding:3px 8px;border-radius:6px;background:var(--gray);font-size:1.12em;font-weight:800}.missing{padding:10px;border:1px dashed var(--red);border-radius:8px;color:#b91c1c;background:#fff7f7;text-align:center}.dark .missing{background:#3b1111;color:#fecaca}
.card-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}.card-grid button{min-height:42px;border:1px solid var(--line);border-radius:9px;font-weight:900;background:var(--gray);color:var(--text)}.card-grid button.current{box-shadow:0 0 0 2px var(--blue) inset}.card-grid button.right{background:#dcfce7;color:#166534;border-color:#86efac}.card-grid button.wrong{background:#fee2e2;color:#991b1b;border-color:#fecaca}.card-grid button.skip{background:#fef3c7;color:#92400e;border-color:#fde68a}.dark .card-grid button.right{background:#052e1b;color:#bbf7d0}.dark .card-grid button.wrong{background:#3b1111;color:#fecaca}.dark .card-grid button.skip{background:#422006;color:#fde68a}.legend{font-size:13px;color:var(--muted);margin-top:10px}
.modal-backdrop{position:fixed;inset:0;background:#0008;z-index:100;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(860px,100%);max-height:88vh;overflow:auto;background:var(--panel);color:var(--text);border-radius:18px 18px 0 0;padding:16px}.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.modal-head h3{margin:0;flex:1}.close{border:0;background:var(--gray);color:var(--text);border-radius:9px;padding:8px 12px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:12px;border:1px solid var(--line);border-radius:12px;text-align:center}.stat b{display:block;font-size:25px}.summary{text-align:center}.score{font-size:44px;font-weight:950;margin:14px}.small{font-size:13px;color:var(--muted)}
@media(max-width:600px){.title{font-size:16px}.question{font-size:18px}.card{padding:15px}.actions{grid-template-columns:repeat(5,1fr)}.btn{font-size:13px;padding:9px 4px}.card-grid{grid-template-columns:repeat(5,1fr)}}
</style></head><body><header class='appbar'><div class='header'><div class='title'>⚡ 电工高级2024题库</div><select id='setSelect' class='set-select'></select></div></header><main class='wrap'><div id='toolbar' class='toolbar'><button data-action='mode' data-mode='normal' class='active'>顺序练习</button><button data-action='mode' data-mode='random'>随机练习</button><button data-action='mode' data-mode='mock'>模拟考试</button><button data-action='card'>🗂 答题卡</button><button data-action='explain'>📖 查看解析</button><button data-action='wrong'>📕 错题本</button><button data-action='stats'>📊 学习统计</button><button data-action='dark'>🌙 夜间模式</button><button data-action='reset'>♻️ 重置当前套</button></div><div id='app'></div></main><div id='modalRoot'></div><script>
function explainText(z){
 var stem=String(z.stem||"").replace(/\\s+/g," ").trim();
 var ans=(z.answer||[]).join("、"),opts=z.options||[],s="";
 function has(re){return re.test(stem)}
 function choices(){
   if(!opts.length)return "";
   var out="<div class='option-reason'><b>选项核对：</b>";
   opts.forEach(function(o){
     var ok=(z.answer||[]).indexOf(o.key)>=0;
     out+="<br><b>"+o.key+"：</b>"+esc2(o.text)+" —— "+(ok?"符合题干条件。":"不符合题干给出的对象、条件或技术定义。");
   });
   return out+"</div>";
 }
 if(has(/150A/)&&has(/150\\/5/)&&has(/90A/)){
   s="<b>考点：电流互感器变比。</b><br>150/5=30，表示一次侧电流是二次侧的30倍。电流表指示90A对应一次侧90A，所以二次侧电流=90÷30=3A。";
 }else if(has(/P700|P0700/)&&has(/端子控制/)){
   s="<b>考点：MICROMASTER 420命令源。</b><br>P0700用于选择运行命令来源，P0700=2表示端子/数字输入控制。注意：P1000负责的是频率给定源，不是启动/停止命令源。";
 }else if(has(/P1000/)&&has(/频率|速度|给定/)){
   s="<b>考点：频率给定源。</b><br>P1000用于选择频率设定值来源。典型设置中P1000=2表示模拟给定；P0700=2则表示命令来自端子/数字输入，两者功能不同。";
 }else if(has(/RLC/)&&has(/XL/)&&has(/XC/)){
   s="<b>考点：串联RLC阻抗。</b><br>先计算X=XL−XC，再计算Z=√(R²+X²)，最后用I=U/Z。XL与XC方向相反，不能直接相加。";
 }else if(has(/趋肤效应|集肤效应/)){
   s="<b>考点：趋肤效应。</b><br>交流频率升高时，电流更集中在导体表面，有效导电截面积减小，因此交流电阻增大；这也是高频感应加热的重要物理基础。";
 }else if(has(/高频淬火/)&&has(/深度|淬硬层/)){
   s="<b>考点：感应加热频率与淬硬深度。</b><br>频率越高，趋肤效应越明显，感应电流集中在更浅的表层，因此高频淬火的加热/淬硬层通常比中频更浅。";
 }else if(has(/振荡器与放大器/)){
   s="<b>考点：振荡器与放大器的区别。</b><br>放大器需要外部输入信号并对其进行放大；振荡器利用反馈和选频网络从电路内部建立周期信号，因此通常不需要外加周期激励。";
 }else if(has(/反馈式振荡器/)&&has(/振幅条件|相位条件/)){
   s="<b>考点：振荡条件。</b><br>持续振荡必须同时满足幅值条件和相位条件。只满足振幅条件，不能保证反馈信号与输入同相，也就不能保证持续振荡。";
 }else if(has(/555定时器/)&&has(/两个比较器/)){
   s="<b>考点：555定时器结构。</b><br>555内部包含两个电压比较器、RS触发器、放电晶体管等。比较器负责检测触发/阈值电压，触发器负责状态保持，不能把全部功能简单归结为两个比较器。";
 }else if(has(/PLC/)&&has(/高速计数器/)){
   s="<b>考点：PLC高速计数。</b><br>普通计数依赖CPU扫描读取输入状态，高频脉冲可能在扫描间隔内发生多次变化而漏计；高速计数器使用专用高速输入/计数机制，可独立于普通扫描处理高速脉冲。";
 }else if(has(/千分尺/)){
   s="<b>考点：千分尺正确使用。</b><br>测量面接近工件时应使用棘轮控制测力，避免直接旋转微分筒造成测力过大和测量误差；千分尺不能当卡规反复卡量工件。";
   if(has(/0.01/))s+="<br>常用千分尺螺杆螺距0.5mm、微分筒50等分，所以分度值=0.5÷50=0.01mm。";
 }else if(has(/UPS/)&&has(/后备式/)){
   s="<b>考点：后备式UPS。</b><br>正常供电时主要由市电供负载，市电异常时才切换到蓄电池和逆变器，因此结构较简单、成本较低，但存在切换时间。";
 }else if(has(/职业道德/)&&has(/诚实守信|爱岗敬业/)){
   s="<b>考点：职业道德规范。</b><br>这类题应抓住题干中的具体职业道德要求。例如“诚实守信”的直接体现是维护信誉、如实履行承诺；“爱岗敬业”强调认真履行岗位职责，而不是只选择自己喜欢的工作。";
 }else if(has(/设备维护|维护保养/)){
   s="<b>考点：设备维护保养。</b><br>维护保养是设备管理的重要组成部分，目的是保持设备技术状态、减少故障并延长使用寿命。生产任务紧张不能成为取消必要维护的理由。";
 }else if(has(/0区/)&&has(/爆炸性气体/)){
   s="<b>考点：爆炸性气体环境分区。</b><br>0区：爆炸性气体混合物连续出现或长时间存在；1区：正常运行时可能出现；2区：正常运行一般不出现，仅在异常情况下短时间出现。";
 }else if(has(/负反馈/)&&has(/稳态误差|静差/)){
   s="<b>考点：负反馈与稳态误差。</b><br>负反馈能够减小误差、改善系统性能；P调节器对阶跃输入通常存在静差，加入积分环节后可消除稳态误差，因此常选PI调节器。";
 }else if(has(/直流电动机/)&&has(/转速负反馈/)){
   s="<b>考点：直流电动机转速负反馈。</b><br>负载增加→电枢电流增加→电枢回路电阻压降增加→转速下降；测速反馈检测到转速下降后提高控制量，从而补偿转速降落。";
 }else if(has(/变压器油/)&&has(/酸味/)){
   s="<b>考点：变压器油老化。</b><br>变压器油长期受热、氧化会发生老化并生成酸性产物，出现明显酸味通常说明油质已经严重老化。";
 }else if(has(/变频器/)&&has(/散热|温度|寿命/)){
   s="<b>考点：变频器热管理。</b><br>变频器工作时必须保证良好散热；温度过高会加速功率器件、电解电容等老化。需要良好散热并不等于所有变频器都“必须配备主动散热装置”。";
 }else if(has(/SPWM/)){
   s="<b>考点：SPWM。</b><br>SPWM通过改变脉冲宽度，使逆变器输出电压的基波接近正弦波。软件生成通常由微处理器/DSP按照采样或计算规则产生调制脉冲；梯形波与三角波比较属于典型硬件比较思想。";
 }else if(has(/接触器|热继电器/)&&has(/电动机|电机/)){
   s="<b>考点：电动机控制与保护。</b><br>接触器主要负责频繁接通、断开电动机；热继电器主要承担过载保护；短路保护通常由断路器或熔断器承担。三者功能不能混淆。";
 }else if(has(/交-直-交|交直交/)&&has(/变频器|变频/)){
   s="<b>考点：交—直—交变频器。</b><br>基本过程是“交流整流→直流中间环节→逆变成可调频率、可调电压的交流”。这是通用变频器最常见的结构。";
 }else if(has(/P调节器/)&&has(/稳态误差|消除稳态误差/)){
   s="<b>考点：PI调节。</b><br>P调节器输出与误差成比例，存在稳态误差；积分环节会持续累积误差，直到稳态误差被消除，所以要求消除静差时应加入I环节，常用PI调节器。";
 }else if(has(/电流截止负反馈/)){
   s="<b>考点：电流截止负反馈。</b><br>它主要用于启动或故障过载时限制电流。正常电流低于截止值时反馈基本不起限制作用；达到截止值后反馈动作，使控制量受到限制，从而保护电机和功率器件。";
 }else if(has(/三相半波可控整流/)&&has(/连续/)){
   s="<b>考点：三相半波可控整流。</b><br>判断输出是否连续要结合触发角α、自然换相点以及负载性质。不能把单相半波整流的结论直接套到三相电路。";
 }else if(has(/晶闸管/)&&has(/单向导电性/)&&has(/可逆运行/)){
   s="<b>考点：晶闸管与可逆调速。</b><br>普通晶闸管具有单向导电特性，直流调速系统需要实现电动机正反向运行时，通常采用反并联桥式结构等方法实现电流方向改变。";
 }else if(has(/三相异步电动机/)&&has(/星形|Y/)&&has(/电阻为6Ω|感抗为8Ω/)){
   s="<b>考点：三相对称Y接负载计算。</b><br>每相阻抗Z=√(6²+8²)=10Ω；Y接时U相=380/√3≈219.4V，且I线=I相，所以I≈219.4/10≈21.94A。";
 }else if(has(/三相电源线电压为380V/)&&has(/10Ω/)){
   s="<b>考点：三相对称电阻负载。</b><br>先看图确认星形还是三角形，再确定仪表测的是线电压、相电压、线电流还是相电流。三角形连接时U相=U线，I线=√3I相；星形连接时U相=U线/√3，I线=I相。";
 }else if(has(/步进电机/)&&has(/控制脉冲/)){
   s="<b>考点：步进电机控制链。</b><br>典型链路为“脉冲发生器→脉冲分配器→功率驱动→步进电机”。脉冲频率主要决定转速，脉冲数量主要决定累计角位移，分配器负责按相序分配驱动信号。";
 }else if(has(/三相对称电路/)&&has(/星形/)){
   s="<b>考点：三相对称星形负载。</b><br>线电压与相电压关系为U线=√3U相；对称星形负载中线电流等于相电流，三相电流大小相等、相位彼此相差120°。";
 }else if(has(/过零触发/)){
   s="<b>考点：过零触发控制。</b><br>过零触发不是通过每个半周改变触发角来斩波，而是在电压过零附近接通/关断，并通过一个设定周期内导通周波数的比例调节平均功率，因此输出波形的每个导通周波较完整。";
 }else if(has(/相控整流/)&&has(/换相/)){
   s="<b>考点：换相。</b><br>相控整流中，电流从一组晶闸管转移到另一组晶闸管的过程叫换相；“整流”是交流变直流的变换过程，两者不是同义词。";
 }else if(has(/运算放大器|集成运放/)&&has(/虚短|虚断/)){
   s="<b>考点：理想运放近似条件。</b><br>在线性负反馈工作区，可近似认为两输入端电压相等（虚短），输入端电流近似为零（虚断）。进入饱和等非线性区域后不能机械使用这两个条件。";
 }else if(has(/编码器/)&&has(/二进制代码/)){
   s="<b>考点：编码器与译码器。</b><br>编码器把输入信息转换成二进制代码；译码器则把代码还原成对应输出，方向相反。题目若描述“把具有特定意义的信息变成二进制代码”，对应编码器。";
 }else if(has(/8051|80C51/)&&has(/ALE/)){
   s="<b>考点：8051 ALE引脚。</b><br>ALE是地址锁存允许信号，在扩展外部存储器时用于锁存低8位地址，因此不能把ALE理解为串行通信或普通数据输出端。";
 }else if(has(/片内.*存储|31脚/)&&has(/低电平/)){
   s="<b>考点：8051 EA引脚。</b><br>EA/VPP用于选择程序存储器来源。使用片内程序存储器时EA应为高电平，因此“访问片内存储器必须接低电平”的说法错误。";
 }else if(has(/消防水泵/)&&has(/全压启动/)){
   s="<b>考点：消防水泵启动方式。</b><br>消防水泵控制并非只有星—三角或自耦降压等方式，在满足设备和供电条件时也存在直接全压启动方案，因此“没有全压启动电路”的绝对表述不成立。";
 }else if(has(/高频计数器|高速计数器/)&&has(/扫描周期/)){
